<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Pink/Cyan Glow -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#190e24" />
      <stop offset="60%" stop-color="#09050f" />
      <stop offset="100%" stop-color="#050308" />
    </radialGradient>

    <!-- Cyber Neon Gradient (Cyan to Pink) -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF107A" />
    </linearGradient>

    <!-- Reverse Neon Gradient -->
    <linearGradient id="cyberNeonRev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF107A" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Card Fill Gradient -->
    <linearGradient id="cardBg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1b122c" />
      <stop offset="100%" stop-color="#0d0818" />
    </linearGradient>
  </defs>

  <!-- 1. Background Rounded App Square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 2. Cyberpunk Matrix Tech Grid Lines -->
  <g opacity="0.12" stroke="#00E5FF" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- 3. Ambient Ambient Glow Orbs -->
  <circle cx="170" cy="190" r="140" fill="#00E5FF" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="340" cy="330" r="140" fill="#FF107A" opacity="0.18" filter="url(#neonGlow)" />

  <!-- 4. Outer App Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#cyberNeon)" stroke-width="3" opacity="0.4" />

  <!-- 5. Stylized Gacha Card Base with Cat Ears (M.I.K.A Proxy Silhouette) -->
  <g filter="url(#neonGlow)">
    <!-- Cat Ear Left -->
    <polygon points="144,140 180,68 226,134" fill="#00E5FF" opacity="0.85" />
    <polygon points="156,136 182,86 214,134" fill="#050308" />

    <!-- Cat Ear Right -->
    <polygon points="368,140 332,68 286,134" fill="#FF107A" opacity="0.85" />
    <polygon points="356,136 330,86 298,134" fill="#050308" />

    <!-- Main Card Body -->
    <rect x="124" y="124" width="264" height="320" rx="28" fill="url(#cardBg)" stroke="url(#cyberNeon)" stroke-width="4.5" />
  </g>

  <!-- 6. Card Inner Matrix Hologram Frame -->
  <rect x="146" y="146" width="220" height="276" rx="18" fill="none" stroke="url(#cyberNeonRev)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Corner Brackets on Card -->
  <path d="M 156 172 L 156 156 L 172 156" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 356 172 L 356 156 L 340 156" fill="none" stroke="#FF107A" stroke-width="3" />
  <path d="M 156 396 L 156 412 L 172 412" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 356 396 L 356 412 L 340 412" fill="none" stroke="#FF107A" stroke-width="3" />

  <!-- 7. Center Radiant Energy Spark & Heart Core -->
  <g filter="url(#coreGlow)" transform="translate(256, 276)">
    <!-- Rotating Cyber Diamonds -->
    <polygon points="0,-72 62,0 0,72 -62,0" fill="none" stroke="#00E5FF" stroke-width="3.5" opacity="0.8" />
    <polygon points="0,-52 44,0 0,52 -44,0" fill="none" stroke="#FF107A" stroke-width="2.5" opacity="0.9" />

    <!-- Glowing Cyber Heart Core -->
    <path d="M 0 -8
             C -4 -28, -34 -28, -34 0
             C -34 20, 0 42, 0 54
             C 0 42, 34 20, 34 0
             C 34 -28, 4 -28, 0 -8 Z"
          fill="url(#cyberNeonRev)" opacity="0.95" />

    <!-- Inner Core Spark Star -->
    <path d="M 0,-24 L 5,-7 L 22,-7 L 8,3 L 13,20 L 0,10 L -13,20 L -8,3 L -22,-7 L -5,-7 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- 8. Micro-Typography & Badges -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="900" letter-spacing="3">
    <!-- Top Card Status -->
    <text x="256" y="182" fill="#00E5FF" text-anchor="middle" opacity="0.9">GACHASWIPE</text>
    
    <!-- SSR Spark Indicator -->
    <text x="256" y="388" fill="#FF107A" text-anchor="middle" opacity="0.95">M.I.K.A • CORE</text>
  </g>

  <!-- 9. Subtle Tech Dots -->
  <circle cx="180" cy="180" r="3" fill="#00E5FF" />
  <circle cx="332" cy="180" r="3" fill="#FF107A" />
  <circle cx="256" cy="406" r="3" fill="#00E5FF" />
</svg>
